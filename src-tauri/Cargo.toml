[package]
name = "pixsmith"
version = "0.1.1"
description = "图匠 PixSmith: offline AI image toolbox"
authors = ["woodti"]
license = "MIT"
repository = "https://github.com/woodti/pixsmith"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pixsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
