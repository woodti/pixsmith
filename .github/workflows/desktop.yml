name: Desktop app

# Push a tag like v0.1.0 to build installers and publish them as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 图匠 PixSmith ${{ github.ref_name }}
          releaseBody: |
            离线版：所有 AI 模型已内置，装好即可断网使用，图片不上传。

            | 系统 | 下载 |
            | --- | --- |
            | Windows 10 / 11 | `PixSmith_x.y.z_x64-setup.exe` |
            | macOS（M 系列芯片） | `PixSmith_x.y.z_aarch64.dmg` |
            | macOS（Intel） | `PixSmith_x.y.z_x64.dmg` |
            | Linux | `.AppImage` 或 `.deb` |

            安装包暂未签名：
            - Windows 出现“已保护你的电脑”时，点“更多信息 → 仍要运行”。
            - macOS 提示“已损坏，无法打开”时，在终端执行 `xattr -cr /Applications/PixSmith.app` 后再打开。
          releaseDraft: false
          prerelease: false
